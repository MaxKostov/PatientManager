<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Admission Statistics</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="statistic-body">
<h2 class="statistic-subtitle">Patient Admission Statistics</h2>

<form class="statistic-form" action="/register/statistics" method="get">
    <label class="statistic-label" for="filter-month">Filter by Month:</label>
    <select class="statistic-select" id="filter-month" name="month">
        <option  value="all" th:selected="${filterMonth == 'all'}">All</option>
        <option value="1" th:selected="${filterMonth == '1'}">January</option>
        <option value="2" th:selected="${filterMonth == '2'}">February</option>
        <option value="3" th:selected="${filterMonth == '3'}">March</option>
        <option value="4" th:selected="${filterMonth == '4'}">April</option>
        <option value="5" th:selected="${filterMonth == '5'}">May</option>
        <option value="6" th:selected="${filterMonth == '6'}">June</option>
        <option value="7" th:selected="${filterMonth == '7'}">July</option>
        <option value="8" th:selected="${filterMonth == '8'}">August</option>
        <option value="9" th:selected="${filterMonth == '9'}">September</option>
        <option value="10" th:selected="${filterMonth == '10'}">October</option>
        <option value="11" th:selected="${filterMonth == '11'}">November</option>
        <option value="12" th:selected="${filterMonth == '12'}">December</option>
    </select>

 <label class="statistic-label" for="filter-year">Filter by Year:</label>
    <select class="statistic-select" id="filter-year" name="year">
       <option value="all" th:selected="${filterYear == 'all'}">All</option>
        <option th:each="year : ${years}"
                th:value="${year}"
                th:text="${year}"
                th:selected="${filterYear == year}">
       </option>
  </select>


    <label class="statistic-label" for="filter-voucher">Filter by Travel Voucher:</label>
    <select class="statistic-select" id="filter-voucher" name="voucher">
        <option value="all" th:selected="${filterVoucher == 'all'}">All</option>
        <option th:each="voucher : ${T(patientmanager.entities.TravelVoucher).values()}"
                th:value="${voucher}"
                th:text="${voucher}"
                th:selected="${filterVoucher == voucher}">
        </option>
    </select>

    <input class="statistic-input" type="checkbox" id="only-active" name="onlyActive" th:checked="${onlyActive}">
    <label class="statistic-label" for="only-active">Show only active patients</label>

    <button class="statistic-button" type="submit">Filter</button>
</form>

<p class="statistic-text">Filtred patients: <span th:text="${patientCount}"></span></p>

<table class="statistic-table" border="1">
    <thead>
    <tr class="statistic-tr">
        <th class="statistic-th">Patient ID</th>
        <th class="statistic-th">Name</th>
        <th class="statistic-th">Surname</th>
        <th class="statistic-th">Admission Date</th>
        <th class="statistic-th">Discharge Date</th>
        <th class="statistic-th">Travel Voucher</th>
        <th class="statistic-th">Address</th>
    </tr>
    </thead>
    <tbody>
    <tr class="statistic-tr" th:each="period : ${stayPeriods}">
        <td class="statistic-td" th:text="${period.patient.id}"></td>
        <td class="statistic-td" th:text="${period.patient.name}"></td>
        <td class="statistic-td" th:text="${period.patient.surname}"></td>
        <td class="statistic-td" th:text="${period.admissionDate}"></td>
        <td class="statistic-td" th:text="${period.dischargeDate}"></td>
        <td class="statistic-td" th:text="${period.travelVoucher}"></td>
        <td class="statistic-td" th:text="${period.patient.address}"></td>
    </tr>
    </tbody>
</table>
    <button class="statistic-button" onclick="window.location.href='/register'">Go Back</button>
</div>
</body>
</html>
