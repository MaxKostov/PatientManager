<!DOCTYPE html>
<html lang="en"  xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<h2>Patient Admission Statistics</h2>

<form action="/statistics" method="get">
    <label for="filter-month">Filter by Month:</label>
    <select id="filter-month" name="month">
        <option value="all" th:selected="${filterMonth == 'all'}">All</option>
        <option value="1" th:selected="${filterMonth == '1'}">January</option>
        <option value="2" th:selected="${filterMonth == '2'}">February</option>
        <option value="3" th:selected="${filterMonth == '3'}">March</option>
        <option value="4" th:selected="${filterMonth == '4'}">April</option>
        <option value="5" th:selected="${filterMonth == '5'}">May</option>
        <option value="6" th:selected="${filterMonth == '6'}">June</option>
        <option value="7" th:selected="${filterMonth == '7'}">July</option>
        <option value="8" th:selected="${filterMonth == '8'}">August</option>
        <option value="9" th:selected="${filterMonth == '9'}">September</option>
        <option value="10" th:selected="${filterMonth == '10'}">October</option>
        <option value="11" th:selected="${filterMonth == '11'}">November</option>
        <option value="12" th:selected="${filterMonth == '12'}">December</option>
    </select>

    <label for="filter-gender">Filter by Gender:</label>
    <select id="filter-gender" name="gender">
        <option value="all" th:selected="${filterGender == 'all'}">All</option>
        <option value="male" th:selected="${filterGender == 'male'}">Male</option>
        <option value="female" th:selected="${filterGender == 'female'}">Female</option>
    </select>

    <label for="filter-voucher">Filter by Travel Voucher:</label>
    <select id="filter-voucher" name="voucher">
        <option value="all" th:selected="${filterVoucher == 'all'}">All</option>
        <option value="1" th:selected="${filterVoucher == '1'}">Type 1</option>
        <option value="2" th:selected="${filterVoucher == '2'}">Type 2</option>
    </select>

    <button type="submit">Filter</button>
</form>

<table>
    <thead>
    <tr>
        <th>Patient ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Gender</th>
        <th>Admission Date</th>
        <th>Discharge Date</th>
        <th>Travel Voucher</th>
        <th>Address</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="patient : ${patients}">
        <td th:text="${patient.id}"></td>
        <td th:text="${patient.name}"></td>
        <td th:text="${patient.surname}"></td>
        <td th:text="${patient.gender}"></td>
        <td th:text="${patient.admissionDate}"></td>
        <td th:text="${patient.dischargeDate}"></td>
        <td th:text="${patient.voucher}"></td>
        <td th:text="${patient.address}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
