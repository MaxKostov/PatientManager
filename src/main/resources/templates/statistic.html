<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Admission Statistics</title>
</head>
<body>
<h2>Patient Admission Statistics</h2>

<form action="/register/statistics" method="get">
    <label for="filter-month">Filter by Month:</label>
    <select id="filter-month" name="month">
        <option value="all" th:selected="${filterMonth == 'all'}">All</option>
        <option value="1" th:selected="${filterMonth == '1'}">January</option>
        <option value="2" th:selected="${filterMonth == '2'}">February</option>
        <option value="3" th:selected="${filterMonth == '3'}">March</option>
        <option value="4" th:selected="${filterMonth == '4'}">April</option>
        <option value="5" th:selected="${filterMonth == '5'}">May</option>
        <option value="6" th:selected="${filterMonth == '6'}">June</option>
        <option value="7" th:selected="${filterMonth == '7'}">July</option>
        <option value="8" th:selected="${filterMonth == '8'}">August</option>
        <option value="9" th:selected="${filterMonth == '9'}">September</option>
        <option value="10" th:selected="${filterMonth == '10'}">October</option>
        <option value="11" th:selected="${filterMonth == '11'}">November</option>
        <option value="12" th:selected="${filterMonth == '12'}">December</option>
    </select>

<!--    <label for="filter-year">Filter by Year:</label>-->
<!--    <select id="filter-year" name="year">-->
<!--        <option value="all" th:selected="${filterYear == 'all'}">All</option>-->
<!--        <option th:each="year : ${years}"-->
<!--                th:value="${year}"-->
<!--                th:text="${year}"-->
<!--                th:selected="${filterYear == year}">-->
<!--        </option>-->
<!--    </select>-->


    <label for="filter-voucher">Filter by Travel Voucher:</label>
    <select id="filter-voucher" name="voucher">
        <option value="all" th:selected="${filterVoucher == 'all'}">All</option>
        <option th:each="voucher : ${T(patientmanager.entities.TravelVoucher).values()}"
                th:value="${voucher}"
                th:text="${voucher}"
                th:selected="${filterVoucher == voucher}">
        </option>
    </select>

    <button type="submit">Filter</button>
</form>

<p>Total Patients: <span th:text="${patientCount}"></span></p>

<table border="1">
    <thead>
    <tr>
        <th>Patient ID</th>
        <th>Name</th>
        <th>Surname</th>
        <th>Admission Date</th>
        <th>Discharge Date</th>
        <th>Travel Voucher</th>
        <th>Address</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="period : ${stayPeriods}">
        <td th:text="${period.patient.id}"></td>
        <td th:text="${period.patient.name}"></td>
        <td th:text="${period.patient.surname}"></td>
        <td th:text="${period.admissionDate}"></td>
        <td th:text="${period.dischargeDate}"></td>
        <td th:text="${period.travelVoucher}"></td>
        <td th:text="${period.patient.address}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
