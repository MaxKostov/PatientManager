<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedures</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="procedures-body">
    <header class="procedures-header">
        <img src="/images/favicon.ico" alt="Company Logo">
    </header>
<div class="procedure-details-container">
    <h2>Procedures</h2>
    <table class="procedures-table">
        <thead>
        <tr>
            <th>Name</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="procedure : ${procedures}">
            <td th:text="${procedure.name}">Procedure Name</td>
            <td>
                <button class="procedures-action-btn"
                        th:data-id="${procedure.id}"
                        th:data-name="${procedure.name}"
                        onclick="openEditModal(this)">Edit</button>
                <form class="procedure-form" th:action="@{/procedures/delete/{id}(id=${procedure.id})}" method="post" style="display:inline;">
                    <button type="submit" class="procedures-action-btn" onclick="return confirm('Are you sure you want to delete this procedure?');">Delete</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
<div id="editModal" class="modal" style="display:none;">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h2>Edit Procedure</h2>
        <form id="editProcedureForm" method="post">
            <input type="hidden" name="id" id="procedureId" />
            <div>
                <label for="procedureName">Name:</label>
                <input type="text" id="procedureName" name="name" required />
            </div>
            <button class="procedures-button" type="submit">Save Changes</button>
        </form>

    </div>
</div>

<div class="procedures-details-container">
    <h2>Add New Procedure</h2>
    <form class="procedures-form" th:action="@{/procedures/add}" method="post">
        <label for="name">Procedure Name:</label>
        <input type="text" id="name" name="name" required />
        <button class="procedures-button" type="submit">Add Procedure</button>
    </form>
</div>

<button class="procedures-button" onclick="window.location.href='/'">Go Back</button>

<script>

    function openEditModal(button) {
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');

        document.getElementById('procedureId').value = id;
        document.getElementById('procedureName').value = name;


        const formAction = `/procedures/edit/${id}`;
        document.getElementById('editProcedureForm').setAttribute('action', formAction);

        document.getElementById('editModal').style.display = 'block';
    }


    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('editModal');
        if (event.target === modal) {
            modal.style.display = 'none';
        }
    }

    function showAlert(message) {
        alert(message);
    }

    window.onload = function() {
        let errorMessage = {errorMessage};
        if (errorMessage) {
            showAlert(errorMessage);
        }
    };

</script>
</div>
</body>
</html>
