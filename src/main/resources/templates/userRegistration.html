<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="userReg-body">
<header class="userReg-header">
    <img src="/images/favicon.ico" alt="Company Logo">
</header>

<div class="userReg-container">
    <h2>Register</h2>
    <form th:action="@{/userReg/save}" method="post">
        <div th:if="${param.success}" class="success">Registration successful! Please <a href="/login">login</a>.</div>
        <div th:if="${param.error}" class="error">Registration failed. Try again.</div>

        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>

        <label for="role">Role</label>
        <select id="role" name="role" required>
            <option value="" disabled selected>Select your role</option>
            <option th:each="role : ${roles}"
                    th:value="${role.id}"
                    th:text="${role.name}"></option>
        </select>

        <button type="submit">Register</button>
    </form>
</div>
</div>
</body>
</html>
